name: perennia
description: An open-source, AI-native workout logger.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  flutter_riverpod: ^3.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  archive: ^4.0.9
  cryptography: ^2.9.0
  http: ^1.2.2
  wakelock_plus: ^1.6.1
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  flutter_secure_storage: ^10.3.1
  sentry_flutter: ^9.22.0
  mobile_scanner: ^7.2.0
  file_selector: ^1.1.0
  local_auth: ^3.0.1
  fl_chart: ^0.69.2

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  sqlite3: ^3.3.3
  yaml: ^3.1.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/seeds/platform_exercises.json
    - assets/seeds/platform_exercises.LICENSE.md
    - assets/seeds/usda_foods.json
