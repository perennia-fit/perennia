name: Release

# A release is a `vX.Y.Z` tag on main. It publishes the server image every
# deployment runs, including the Official Service, and a GitHub Release with
# the CHANGELOG section. Deploys and store builds are cut only from these tags
# (docs/releasing.md), so nothing here runs for an ordinary merge to main.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Check the tag names the versions in the tree, on main
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node tools/check-release.mjs --tag "$TAG" --notes-file release-notes.md
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Keep the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  server-image:
    name: Publish server image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The exact version tag is immutable by convention: a deployment pins it,
      # and re-pushing it would change what that pin runs. `latest` follows the
      # newest release for self-hosters who want it.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/perennia-server:${{ needs.verify.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/perennia-server:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, server-image]
    permissions:
      contents: write
    steps:
      - name: Fetch the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Perennia $TAG" \
            --notes-file release-notes.md \
            --verify-tag
