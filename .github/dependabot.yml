version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/server"
      - "/packages/contract"
      - "/packages/golden-vectors"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 5
    groups:
      # Routine updates travel together and are usually mergeable on a green
      # gate. Majors are excluded deliberately: grouped with a dozen patches, a
      # single breaking release fails the whole batch and blocks all of it —
      # which is exactly what a TypeScript major did here. Majors arrive as
      # their own pull requests, where they can be read and migrated.
      js-workspace:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pub"
    directories:
      - "/"
      - "/apps/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 5
    groups:
      dart-workspace:
        patterns:
          - "*"

